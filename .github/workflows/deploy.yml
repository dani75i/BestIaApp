name: Publier BestIA sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test

      - name: Construire le site
        run: npm run build

      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Déployer
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Vérifier la configuration GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
